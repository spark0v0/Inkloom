[project]
name = "story-workshop-backend"
version = "0.1.0"
description = "Local, author-led novel writing workspace"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.149.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
story-workshop = "app.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
